name: Publish CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Configure this environment in GitHub with required reviewers if you want
    # a manual approval gate before a release reaches npm.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/cli version v$VERSION" >&2
            exit 1
          fi

      - name: Build registry
        run: bun run build:registry

      - name: Typecheck
        run: bun run check-types

      - name: Build CLI
        run: bun run --cwd apps/cli build

      - name: Publish
        working-directory: apps/cli
        # Trusted Publishing uses the GitHub OIDC token above. No NPM_TOKEN.
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: apps/cli/CHANGELOG.md
